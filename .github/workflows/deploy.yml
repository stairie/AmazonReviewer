name: Deploy to EC2

on:
  push:
    branches: [ main ]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build

    - name: Write deployment version marker
      run: |
        printf '{"commit":"%s","deployedAt":"%s"}\n' "${GITHUB_SHA}" "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" > dist/version.json

    - name: Deploy built files and server to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: ${{ secrets.EC2_PORT }}
        source: "dist,server"
        target: "/tmp/amazon-reviewer/"

    - name: Update EC2 deployment
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: ${{ secrets.EC2_PORT }}
        script: |
          # Copy React build to web directory
          sudo rm -rf /var/www/html/*
          sudo cp -r /tmp/amazon-reviewer/dist/* /var/www/html/
          sudo chown -R www-data:www-data /var/www/html
          sudo chmod -R 755 /var/www/html

          # Deploy backend server
          sudo mkdir -p /var/app/amazon-reviewer
          sudo cp -r /tmp/amazon-reviewer/server/* /var/app/amazon-reviewer/
          cd /var/app/amazon-reviewer
          sudo npm install --omit=dev

          # Preserve existing server .env. Bootstrap only if missing.
          if [ ! -f /var/app/amazon-reviewer/.env ]; then
            printf 'OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}\nOPENAI_ASSISTANT=${{ secrets.OPENAI_ASSISTANT }}\nOPENAI_RESPONSES_MODEL=${{ secrets.OPENAI_RESPONSES_MODEL }}\nOPENAI_REVIEW_INSTRUCTIONS_FILE=review-instructions.txt\nFETCH_REVIEW_CONTEXT=${{ secrets.FETCH_REVIEW_CONTEXT }}\nREVIEW_FETCH_TIMEOUT_MS=${{ secrets.REVIEW_FETCH_TIMEOUT_MS }}\nREVIEW_CONTEXT_CHAR_LIMIT=${{ secrets.REVIEW_CONTEXT_CHAR_LIMIT }}\n' | sudo tee /var/app/amazon-reviewer/.env > /dev/null
            echo "Created /var/app/amazon-reviewer/.env from GitHub secrets (first deploy bootstrap)."
          else
            echo "Keeping existing /var/app/amazon-reviewer/.env (not overwritten)."
          fi

          # Optional manual override: set repository secret DEPLOY_OVERWRITE_ENV=true
          if [ "${{ secrets.DEPLOY_OVERWRITE_ENV }}" = "true" ]; then
            printf 'OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}\nOPENAI_ASSISTANT=${{ secrets.OPENAI_ASSISTANT }}\nOPENAI_RESPONSES_MODEL=${{ secrets.OPENAI_RESPONSES_MODEL }}\nOPENAI_REVIEW_INSTRUCTIONS_FILE=review-instructions.txt\nFETCH_REVIEW_CONTEXT=${{ secrets.FETCH_REVIEW_CONTEXT }}\nREVIEW_FETCH_TIMEOUT_MS=${{ secrets.REVIEW_FETCH_TIMEOUT_MS }}\nREVIEW_CONTEXT_CHAR_LIMIT=${{ secrets.REVIEW_CONTEXT_CHAR_LIMIT }}\n' | sudo tee /var/app/amazon-reviewer/.env > /dev/null
            echo "DEPLOY_OVERWRITE_ENV=true, overwrote /var/app/amazon-reviewer/.env from GitHub secrets."
          fi

          # Install PM2 if needed, then restart server
          sudo npm install -g pm2
          pm2 restart amazon-reviewer 2>/dev/null || pm2 start /var/app/amazon-reviewer/index.js --name amazon-reviewer
          pm2 save

          # Clean up and restart nginx
          rm -rf /tmp/amazon-reviewer
          sudo systemctl restart nginx

          echo "Deployment completed successfully!"